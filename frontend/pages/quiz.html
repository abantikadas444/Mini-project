<body>

        <nav class="navbar">

            <div class="logo">

            <ul class="nav-links">

        <section class="quiz-section">

            <h1>HTML Quiz</h1>

            <div class="quiz-card">

                <h2 id="question">
                    Loading question...
                </h2>

                <div class="options"></div>

                <p id="result"></p>

                <button
                    id="next-button"
                    class="btn"
                    onclick="nextQuestion()"
                    style="display: none;">
                    Next
                </button>

            </div>

        </section>

    </main>


    <script src="../js/quiz.js"></script>
